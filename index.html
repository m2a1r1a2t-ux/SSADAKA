<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Садақа</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .main {
            width: 100%;
            height: 100vh;
            position: relative;

            /* НЕГІЗГІ ФОН ФОТО */
            background-image: url("WhatsApp Image 2026-08-27 at 12.58.28.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Фотоны сәл қараңғылау */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
        }

        /* Жоғарғы жазу */
        .title {
            position: absolute;
            top: 40px;
            left: 20px;
            right: 20px;

            text-align: center;
            color: white;
            font-size: 28px;
            font-weight: bold;
            line-height: 1.4;
            z-index: 2;

            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* Төменгі кнопка */
        .bottom-area {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 100%;

            display: flex;
            justify-content: center;

            padding: 0 20px;
            z-index: 2;
        }

        /* Қызыл кнопка */
        .kaspi-button {
            width: 3320px;
            height: 60px;

            position: relative;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #ec221f;
            color: white;

            text-decoration: none;
            font-size: 18px;
            font-weight: bold;

            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);

            transition: 0.2s;
        }

        /* Кнопканың ішіндегі сол жақ фото */
        .small-photo {
            position: absolute;
            left: 8px;

            width: 44px;
            height: 44px;

            border-radius: 50%;
            object-fit: cover;

            background: white;
        }

        .kaspi-button:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="overlay"></div>

        <!-- ЖОҒАРҒЫ ЖАЗУ -->
        <div class="title">
            Алла сүйгендерге садақа беруді бұйырады.<br>
            (Бақара сүресі, 267-аят)
        </div>

        <!-- ТӨМЕНГІ БӨЛІМ -->
        <div class="bottom-area">

            <!-- ҚЫЗЫЛ КНОПКА -->
            <a
                href="https://pay.kaspi.kz/pay/jkuvfnrl"
                class="kaspi-button"
                target="_blank"
            >
                <!-- КНОПКА ІШІНДЕГІ ФОТО -->
                <img
                    src="kaspi.jpg"
                    alt="Kaspi"
                    class="small-photo"
                >

                <span>САДАҚА</span>
            </a>

        </div>

    </div>

</body>
</html>
